apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fastapi-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fastapi-rb
subjects:
  - kind: ServiceAccount
    name: fastapi-sa
roleRef:
  kind: Role
  name: fastapi-role
  apiGroup: rbac.authorization.k8s.io